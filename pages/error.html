<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Помилка — TechVolt</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .error-page { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px; position:relative; }
    .error-page__code { font-family:var(--font-head); font-size:clamp(6rem,20vw,12rem); font-weight:800; color:var(--accent); line-height:1; opacity:0.1; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
    .error-page__content { position:relative; z-index:1; max-width:560px; }
    .error-page__icon { font-size:4rem; margin-bottom:20px; }
    .error-page__title { font-size:clamp(1.6rem,3vw,2.4rem); margin-bottom:12px; }
    .error-page__desc { color:var(--text-muted); font-size:1.05rem; margin-bottom:8px; }
    .error-page__action { color:var(--text-muted); font-size:0.95rem; margin-bottom:36px; }
    .error-page__buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:24px; }
    .report-form { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:left; margin-top:24px; }
    .report-form h3 { font-size:1rem; margin-bottom:16px; }
    .report-form textarea { width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:var(--font-body); font-size:0.9rem; resize:vertical; min-height:80px; outline:none; }
    .report-form textarea:focus { border-color:var(--accent); }
    .error-id { font-size:0.72rem; color:var(--text-dim); font-family:monospace; margin-top:16px; }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <nav class="nav container">
      <a href="../index.html" class="logo">⚡ Tech<span>Volt</span></a>
    </nav>
  </header>
  <main class="error-page" role="main" aria-labelledby="error-title">
    <div class="error-page__code" aria-hidden="true">500</div>
    <div class="error-page__content">
      <div class="error-page__icon">⚠️</div>
      <h1 id="error-title" class="error-page__title">Щось пішло не так</h1>
      <p class="error-page__desc">Виникла непередбачена помилка. Ми вже працюємо над її вирішенням.</p>
      <p class="error-page__action">Спробуйте оновити сторінку або повернутись на головну. Якщо проблема повторюється — повідомте нас.</p>
      <div class="error-page__buttons">
        <button onclick="location.reload()" class="btn-primary">Оновити сторінку</button>
        <a href="../index.html" class="btn-ghost">На головну</a>
      </div>
      <div class="report-form">
        <h3>Повідомити про проблему</h3>
        <textarea id="stepsInput" placeholder="Опишіть кроки які призвели до помилки..."></textarea>
        <button onclick="sendReport()" class="btn-primary" style="margin-top:12px;width:100%;justify-content:center">Надіслати звіт</button>
      </div>
      <div class="error-id" id="errorId"></div>
    </div>
  </main>
  <script src="../js/logger.js"></script>
  <script src="../js/error-handler.js"></script>
  <script>
    const errorId = new URLSearchParams(window.location.search).get('id')
      || 'ERR-500-' + Math.random().toString(36).slice(2,8).toUpperCase();
    document.getElementById('errorId').textContent = 'ID помилки: ' + errorId;
    Logger.error('Router', 'Відображено сторінку помилки', { errorId, url: window.location.href });

    function sendReport() {
      const steps = document.getElementById('stepsInput').value.trim();
      const subject = encodeURIComponent('Помилка: ' + errorId);
      const body = encodeURIComponent(
        'ID помилки: ' + errorId + '\n' +
        'Сторінка: ' + window.location.href + '\n' +
        'Браузер: ' + navigator.userAgent + '\n' +
        'Кроки відтворення:\n' + (steps || 'не вказано')
      );
      window.location.href = 'mailto:support@techvolt.ua?subject=' + subject + '&body=' + body;
      Logger.info('ErrorReport', 'Користувач надіслав звіт про помилку', { errorId });
    }
  </script>
</body>
</html>
